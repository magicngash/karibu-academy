<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karibu Academy · Hybrid Assessment Lab</title>
  <style>
    :root{--ink:#152d2a;--muted:#6b7d78;--cream:#f7f4ed;--paper:#fffdf8;--teal:#0f766e;--teal2:#0b544f;--coral:#e87961;--line:#dce6e1;--shadow:0 18px 48px #153a3212}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.shell{min-height:100vh}.topbar{height:72px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px)}.brand{font-weight:800;letter-spacing:-.03em;font-size:20px}.brand span{color:#f2ad6f}.topbar small{color:#b4c7c1}.wrap{max-width:1180px;margin:auto;padding:34px 22px 70px}.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center;padding:30px 0 25px}.eyebrow{color:var(--coral);font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.hero h1{font-size:clamp(35px,5vw,62px);line-height:1.02;letter-spacing:-.055em;margin:12px 0 18px;max-width:760px}.hero p{font-size:18px;color:var(--muted);max-width:620px}.hero-art{background:var(--teal);color:#fff;border-radius:28px;padding:30px;min-height:280px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero-art:after{content:"✦";font-size:210px;line-height:1;position:absolute;right:-20px;bottom:-75px;color:#ffffff14}.hero-art strong{font-size:31px;line-height:1.1;display:block;max-width:260px;position:relative;z-index:1}.hero-art p{color:#d5e9e3;position:relative;z-index:1;font-size:15px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:25px;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.grid.two{grid-template-columns:repeat(2,1fr)}.stat{padding:20px}.stat b{font-size:30px;display:block}.stat span{color:var(--muted);font-size:13px}.btn{padding:11px 16px;border-radius:10px;font-weight:750;transition:.15s;display:inline-flex;align-items:center;gap:7px}.btn:hover{transform:translateY(-1px)}.primary{background:var(--teal);color:#fff}.secondary{background:#e7f2ed;color:var(--teal2)}.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}.topbar .ghost{color:#fff;border-color:#5f7872}.danger{background:#fff0ec;color:#a94331}.form{max-width:480px;margin:50px auto}.form h1{font-size:34px;line-height:1.1;margin:6px 0 8px}.field{margin:15px 0}.field label{font-weight:700;display:block;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid #cbd9d4;border-radius:10px;background:#fff}.field textarea{min-height:130px;resize:vertical}.notice{padding:12px 14px;border-radius:10px;background:#fff4de;color:#715117;margin:14px 0}.error{background:#fff0ec;color:#9e3b2a}.success{background:#e5f5eb;color:#24623c}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}.nav .active{background:var(--ink);color:#fff}.section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:24px 0 12px}.section-title h2{margin:0;font-size:24px}.lesson{display:grid;grid-template-columns:70px 1fr;gap:18px}.lesson-num{width:56px;height:56px;border-radius:16px;background:#e5f1ec;color:var(--teal);display:grid;place-items:center;font-size:21px;font-weight:800}.lesson h3{margin:0 0 5px}.lesson p{margin:6px 0;color:#455b55}.lesson ul{margin:9px 0;padding-left:20px}.script{border-left:3px solid var(--coral);padding:9px 13px;background:#fff7f2;margin-top:12px}.pill{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:800;background:#e8f2ed;color:var(--teal)}.question{margin:18px 0;padding:21px;border:1px solid var(--line);border-radius:15px;background:#fff}.question h3{font-size:17px;margin:0 0 14px}.option{display:block;padding:12px 13px;margin:9px 0;border:1px solid var(--line);border-radius:10px}.option:has(input:checked){border-color:var(--teal);background:#eff8f4}.option input{margin-right:9px}.progress{height:9px;border-radius:9px;background:#e6eeea;overflow:hidden}.progress i{height:100%;display:block;background:var(--coral);border-radius:inherit}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0}.score{font-size:39px;font-weight:850;letter-spacing:-.05em}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px 10px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.07em}.check-row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:13px 0}.check-row select{width:170px;padding:8px;border:1px solid var(--line);border-radius:8px}.report-block{padding:17px;border:1px solid var(--line);border-radius:13px;margin:12px 0}.muted{color:var(--muted)}.right{display:flex;gap:8px;align-items:center;justify-content:flex-end}.small{font-size:13px}.hide{display:none!important}@media(max-width:780px){.hero{grid-template-columns:1fr}.grid,.grid.two{grid-template-columns:1fr}.topbar{height:auto;padding:16px 20px;gap:10px}.topbar small{display:none}.wrap{padding:25px 15px 55px}.card{padding:19px}.lesson{grid-template-columns:48px 1fr;gap:12px}.lesson-num{width:44px;height:44px}.right{justify-content:flex-start;flex-wrap:wrap}}
  </style>

<body><div id="app"></div>
<script>
const MODULE={id:1,title:'Greeting and Welcoming Guests',subtitle:'Warm Welcomes, First Impressions, and Service Presence',description:'Build a strong first-contact standard that works in restaurants and beyond.',objectives:['Greet every guest quickly and warmly, no matter how busy you are.','Use simple, friendly words that make guests feel welcome.','Notice new guests walking in, even while busy with another table.'],lessons:[
 {title:'The 30-Second Rule',body:'Every guest who walks in should be noticed and greeted within 30 seconds. You do not have to seat them or take their order right away — they just need to know someone has seen them and will help them soon.',how:["If you are free, walk over and smile.","If you are busy, look at them, smile, and say ‘I’ll be right with you!’","Never let a guest stand at the door wondering if anyone noticed them."],example:'A guest walks in while you carry a tray of food; glance over, smile, and say “Welcome! I’ll be with you in just a moment.”',why:'Waiting without being noticed feels much longer than it really is.',script:'“Welcome to [Establishment Name]. My name is [Name]. It’s a pleasure to have you with us.”'},
 {title:'Greeting Every Guest the Right Way',body:'How you greet a guest matters just as much as how fast you do it. Hospitality standards are simple, agreed-upon habits for posture, eye contact, and the words we use.',how:['Stand up straight with open body language.','Make gentle eye contact — it shows confidence and respect.','Use a warm greeting.'],example:'Compare “Table for how many?” said flatly with “Welcome to [Restaurant Name]! How are you doing today? Right this way.” said with a smile.',why:'A warm greeting builds trust immediately.'},
 {title:'Active Host Scanning',body:'When you are serving another table, carrying plates, or taking an order, keep part of your attention on the entrance. This is active host scanning.',how:['Glance toward the door as you move through the floor.','Make eye contact and smile the moment you spot a new guest.','Finish your task calmly, then greet them properly as soon as you can.'],example:'You are taking an order at Table 2 when a new couple walks in. You glance toward the door, smile, and continue taking the order.',why:'A guest should never feel invisible during busy operating hours.'},
 {title:'Professional Presence and Body Language',body:'Posture, facial expression, eye contact, and tone work together to look attentive without looking stiff.',how:['Maintain upright posture and open facial expressions.','Keep gentle eye contact.','Use a calm, pleasant tone.'],example:'Standing tall with relaxed shoulders and an open stance projects calm confidence.',why:'Guests form immediate impressions based on physical presence and posture.'},
 {title:'Recognizing Guest Mood on Arrival',body:'Identify whether a guest arrives rushed, relaxed, confused, upset, or celebratory, and adjust your style accordingly.',how:['Observe walking pace and facial expressions.','Tailor your greeting speed and tone to match their mood.','Keep your core greeting the same — adjust tone and pace.'],example:'A celebratory couple should be welcomed with festive warmth rather than processed like a routine table.',why:'Matching the guest’s mood builds instant rapport.'},
 {title:'Managing Multiple Arrivals',body:'Greet one guest while acknowledging others, so nobody feels invisible during a busy period.',how:['Welcome the primary guest verbally.','Offer a quick nod, smile, or hand gesture to secondary arrivals.','Bring in another staff member if arrivals are heavy.'],example:'Greet the first party while raising a finger and smiling at a second arriving party to show you will be with them shortly.',why:'Acknowledging waiting arrivals prevents the “ignored at the door” problem.',script:'“Welcome to [Establishment Name]. We’ll be with you in just a moment. Thank you for your patience.”'}
],
 mcq:[
  {q:'You are taking an order at Table 2 when a new couple walks in. What should you do?',o:['Finish the order first, then greet them once you are done','Make eye contact and smile at the new guests, then finish the order','Stop the order immediately to greet them at the door','Ask another guest to handle the welcome'],a:1},
  {q:'Which greeting best fits the hospitality standards in the lesson?',o:['“Table for how many?” with no greeting first','“Welcome to [Restaurant Name], how are you doing today?”','“Yes, sit anywhere.”','“Wait there until I am free.”'],a:1},
  {q:'A guest arrives looking intensely rushed and checking their watch. How should you adjust?',o:['Acknowledge their pace and provide efficient, direct service','Slow them down with a long, detailed story','Ignore their urgency completely','Tell them to come back later'],a:0},
  {q:'Multiple parties arrive at the entrance at the same time. How do you handle the second group?',o:['Look away and pretend they are not there','Tell them to walk back outside','Give them a quick nod, smile, or hand gesture to show they are noticed','Serve the second group first without greeting the first'],a:2},
  {q:'Which action demonstrates professional presence?',o:['Crossing your arms and avoiding eye contact','Slouching so guests do not interrupt','Standing upright, using open body language and a calm tone','Speaking as quickly as possible'],a:2}
 ],
 rubrics:[
  {id:'w1',q:'You are carrying a tray during a busy Friday evening when three groups arrive. Explain exactly how you would welcome and acknowledge them while continuing your task.',objective:'Apply the 30-second rule, active host scanning and multiple-arrival standards during a busy period.',elements:['notice guests promptly / within 30 seconds','eye contact and warm smile or greeting while busy','calmly finish the current task rather than abandoning it','acknowledge secondary arrivals with a nod, smile or gesture','follow up with a proper welcome when free'],essential:['prompt acknowledgement','a verbal or non-verbal welcome','calm continuation and follow-up'],partial:'Award partial credit when the learner describes prompt acknowledgement and a follow-up but omits one supporting detail.',max:5},
  {id:'w2',q:'A couple arrives celebrating, while another guest looks rushed and a third group is waiting. Explain how your greeting, body language, tone and pace should respond to each guest.',objective:'Adapt greeting style to guest mood while maintaining professional presence and consistent welcome standards.',elements:['observe mood from pace or facial expression','use celebratory warmth for the happy couple','use efficient, direct service for the rushed guest','acknowledge the waiting group so they do not feel invisible','maintain upright/open posture, eye contact and calm tone'],essential:['adapt tone or pace to mood','professional body language','acknowledge waiting guests'],partial:'Award partial credit when the learner identifies at least two mood adaptations and one professional behaviour.',max:5}
 ]
};
const USERS=[{email:'amina@demo.test',password:'demo123',name:'Amina Otieno',role:'learner',restaurant:'Savanna Table'},{email:'manager@demo.test',password:'demo123',name:'Daniel Mwangi',role:'manager',restaurant:'Savanna Table'},{email:'admin@demo.test',password:'demo123',name:'Lab Administrator',role:'admin',restaurant:'Karibu Academy'}];
const KEY='karibu_hybrid_lab_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{"users":[],"attempts":[],"reports":[],"settings":{"mcqPass":4,"writtenAverage":4}}');
let session=JSON.parse(localStorage.getItem(KEY+'_session')||'null'); let view='home'; let currentAttempt=null; let pendingNotice='';
function save(){localStorage.setItem(KEY,JSON.stringify(db))} function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function user(){return session} function allUsers(){return [...USERS,...db.users]}
function layout(content){document.getElementById('app').innerHTML=`<header class="topbar"><div class="brand">karibu <span>academy</span></div><small>HYBRID ASSESSMENT LAB · MODULE 1</small><div>${session&&view!=='home'?`<button class="btn ghost" onclick="go('home')">← Back</button> `:''}${session?`<span class="small">${esc(session.name)}</span> <button class="btn ghost" onclick="logout()">Sign out</button>`:''}</div></header><main class="wrap">${content}</main>`}
function home(){layout(`<section class="hero"><div><div class="eyebrow">Independent experimental lab</div><h1>Greeting and Welcoming Guests</h1><p>${MODULE.description} Complete the lesson, demonstrate your knowledge, explain your application, then invite a manager to verify workplace behaviour.</p><div class="right" style="justify-content:flex-start;margin-top:22px"><button class="btn primary" onclick="go('login')">Start with a test account →</button><button class="btn secondary" onclick="go('lesson')">Preview lesson</button></div></div><div class="hero-art"><strong>Warm welcomes create confident first impressions.</strong><p>Seven questions · structured rubric marking · manager verification</p><span class="pill">Module 1 · 1 of many</span></div></section><section class="grid"><div class="card stat"><b>5</b><span>knowledge questions · 5 marks</span></div><div class="card stat"><b>2</b><span>application scenarios · 10 marks</span></div><div class="card stat"><b>1</b><span>manager-led workplace verification</span></div></section><section class="card" style="margin-top:20px"><div class="section-title"><h2>What this lab tests</h2><span class="pill">Authoritative Module 1 lesson</span></div><div class="grid">${MODULE.objectives.map((x,i)=>`<div><div class="eyebrow">0${i+1}</div><p>${esc(x)}</p></div>`).join('')}</div></section>`)}
function go(v){view=v;render()} function logout(){session=null;localStorage.removeItem(KEY+'_session');go('home')}
function login(){layout(`<div class="card form"><div class="eyebrow">Secure test access</div><h1>Sign in to the lab</h1><p class="muted">Use a demo account or create a learner test account. This environment is separate from production.</p>${pendingNotice?`<div class="notice error">${esc(pendingNotice)}</div>`:''}<div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="demo123"></div><button class="btn primary" onclick="signin()">Sign in</button><button class="btn ghost" onclick="registerForm()">Create learner account</button><button class="btn ghost" onclick="go('home')">← Back to welcome</button><hr><p class="small muted">Demo shortcuts</p><div class="right" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn secondary" onclick="demo('learner')">Learner</button><button class="btn secondary" onclick="demo('manager')">Manager</button><button class="btn secondary" onclick="demo('admin')">Admin</button></div></div>`)}
function demo(role){const u=USERS.find(x=>x.role===role);session={...u};localStorage.setItem(KEY+'_session',JSON.stringify(session));go(role==='learner'?'dashboard':role)}
function signin(){const u=allUsers().find(x=>x.email.toLowerCase()===(document.getElementById('email').value||'').toLowerCase()&&x.password===document.getElementById('password').value);if(!u){pendingNotice='We could not verify those test credentials.';return login()}session={...u};localStorage.setItem(KEY+'_session',JSON.stringify(session));go(u.role==='learner'?'dashboard':u.role)}
function registerForm(){layout(`<div class="card form"><div class="eyebrow">New test learner</div><h1>Create an account</h1><div class="field"><label>Full name</label><input id="rname"></div><div class="field"><label>Email</label><input id="remail" type="email"></div><div class="field"><label>Restaurant</label><input id="rrest" value="Test Restaurant"></div><div class="field"><label>Password</label><input id="rpass" type="password" value="demo123"></div><button class="btn primary" onclick="register()">Create account</button> <button class="btn ghost" onclick="go('login')">Back</button></div>`)}
function register(){const u={name:document.getElementById('rname').value.trim(),email:document.getElementById('remail').value.trim(),restaurant:document.getElementById('rrest').value.trim(),password:document.getElementById('rpass').value,role:'learner'};if(!u.name||!u.email||!u.password){pendingNotice='Please complete all required fields.';return registerForm()}db.users.push(u);save();session={...u};localStorage.setItem(KEY+'_session',JSON.stringify(session));go('dashboard')}
function learnerNav(active){return `<nav class="nav"><button class="btn ghost" onclick="go('home')">← Back</button><button class="btn ${active==='dashboard'?'active':''}" onclick="go('dashboard')">My progress</button><button class="btn ${active==='lesson'?'active':''}" onclick="go('lesson')">Lesson</button>${active==='assessment'?'':''}<button class="btn" onclick="go('report')">My competency report</button></nav>`}
function dashboard(){const attempts=db.attempts.filter(a=>a.userEmail===session.email);const latest=attempts.at(-1);layout(`${learnerNav('dashboard')}<div class="hero" style="padding-top:0"><div><div class="eyebrow">Welcome back, ${esc(session.name.split(' ')[0])}</div><h1 style="font-size:42px">Your Module 1 journey</h1><p>Finish the lesson, then complete the seven-question assessment. A manager verifies workplace competency separately.</p></div><div class="card"><div class="eyebrow">Online status</div><div class="score">${latest?(latest.mcqScore??'—')+'/5':'—'}</div><div class="muted">Knowledge score</div>${latest?`<span class="pill">${latest.status==='passed'?'Online assessment passed':'Retake available'}</span>`:'<span class="pill">Not started</span>'}</div></div><div class="card"><div class="section-title"><h2>Module 1 · ${MODULE.title}</h2><span class="pill">${attempts.length} attempt${attempts.length===1?'':'s'}</span></div><div class="progress"><i style="width:${latest?(latest.submitted?100:55):20}%"></i></div><p class="muted">${latest?latest.status==='passed'?'Online assessment complete. Invite your manager to verify workplace performance.':'Your previous attempt did not meet both thresholds. You can retake with a fresh question set.':'Start with the lesson content from the approved Module 1 source.'}</p><div class="right" style="justify-content:flex-start"><button class="btn primary" onclick="go('lesson')">${latest?'Review lesson':'Open lesson'} →</button>${latest&&latest.status!=='passed'?`<button class="btn secondary" onclick="startAssessment()">Retake assessment</button>`:''}${latest&&latest.status==='passed'?`<button class="btn secondary" onclick="go('report')">View report</button>`:''}</div></div>`)}
function lesson(){layout(`${learnerNav('lesson')}<div class="section-title"><div><div class="eyebrow">Module 1 · Lesson</div><h2>${MODULE.subtitle}</h2></div><button class="btn primary" onclick="beginAssessment()">${session?'Start assessment →':'Sign in to assess →'}</button></div><div class="card"><p>${MODULE.description}</p><h3>Learning objectives</h3><ul>${MODULE.objectives.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>${MODULE.lessons.map((l,i)=>`<article class="card lesson"><div class="lesson-num">${i+1}</div><div><h3>${esc(l.title)}</h3><p>${esc(l.body)}</p><strong>How to apply it</strong><ul>${l.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="script"><b>In practice</b><br>${esc(l.example)}${l.script?`<br><br><b>Suggested language</b><br>${esc(l.script)}`:''}</div><p class="small"><b>Why it matters:</b> ${esc(l.why)}</p></div></article>`).join('')}`)}
function beginAssessment(){session?startAssessment():go('login')}
function startAssessment(){currentAttempt={id:crypto.randomUUID(),userEmail:session.email,startedAt:new Date().toISOString(),questions:MODULE.mcq.map((q,i)=>({...q,order:i,options:q.o.map((x,j)=>({text:x,correct:j===q.a})).sort(()=>Math.random()-.5)})),answers:{},written:{},rubricVersion:'module-1-v1',submitted:false};go('assessment')}
function assessment(){layout(`${learnerNav('assessment')}<div class="section-title"><div><div class="eyebrow">Assessment · answers lock on submit</div><h2>Show what you understand</h2></div><span class="pill">7 questions · 15 marks</span></div><div class="notice">Do not use outside help while answering. You will receive feedback after submission; correct answers and marking hints are not shown during the assessment.</div><form id="assessmentForm"><h3>Part A · Knowledge <span class="muted">5 marks</span></h3>${currentAttempt.questions.map((q,i)=>`<section class="question"><h3>${i+1}. ${esc(q.q)}</h3>${q.options.map((o,j)=>`<label class="option"><input required type="radio" name="m${i}" value="${j}"> ${esc(o.text)}</label>`).join('')}</section>`).join('')}<h3>Part B · Application <span class="muted">10 marks</span></h3>${MODULE.rubrics.map((r,i)=>`<section class="question"><span class="eyebrow">Scenario ${i+1}</span><h3>${esc(r.q)}</h3><p class="muted small">Write in your own words. The rubric evaluates demonstrated understanding, not spelling or exact phrases.</p><textarea required name="w${i}" placeholder="Explain what you would do and why..."></textarea></section>`).join('')}<button class="btn primary" type="submit">Submit complete assessment →</button></form>`);document.getElementById('assessmentForm').onsubmit=e=>{e.preventDefault();submitAssessment(new FormData(e.target))}}
function gradeWrittenAnswer(text,r){const t=text.toLowerCase();const groups=r.elements.map(e=>{const words=e.toLowerCase().split(/\s+/).filter(w=>w.length>3);return words.some(w=>t.includes(w))});let score=groups.filter(Boolean).length;const essentialHit=r.essential.filter(e=>e.split(/\s+/).some(w=>w.length>3&&t.includes(w))).length;if(essentialHit<2)score=Math.min(score,2);score=Math.max(0,Math.min(5,score));return {score,max:5,satisfied:r.elements.filter((_,i)=>groups[i]),missed:r.elements.filter((_,i)=>!groups[i]),explanation:score>=4?'The answer demonstrates the key behaviours in the rubric.':score>=2?'The answer shows some relevant understanding but leaves important behaviours unclear.':'The answer does not yet demonstrate enough of the required behaviours.',improvement:score>=4?'Keep practising the sequence under pressure and adapt tone to the guest.':'Name the specific action, timing, body language and follow-up you would use; avoid general statements.',status:'complete',rubricVersion:'module-1-v1'} }
function submitAssessment(fd){const a=currentAttempt;a.questions.forEach((q,i)=>a.answers[i]=Number(fd.get('m'+i)));a.written={};MODULE.rubrics.forEach((r,i)=>{const text=fd.get('w'+i);a.written[r.id]={answer:text,grading:gradeWrittenAnswer(text,r)}});a.mcqScore=a.questions.reduce((n,q,i)=>n+(q.options[a.answers[i]]?.correct?1:0),0);a.writtenScores=MODULE.rubrics.map(r=>a.written[r.id].grading.score);a.writtenAverage=a.writtenScores.reduce((x,y)=>x+y,0)/2;a.status=a.mcqScore>=db.settings.mcqPass&&a.writtenAverage>=db.settings.writtenAverage?'passed':'failed';a.submitted=true;a.submittedAt=new Date().toISOString();db.attempts.push(a);save();currentAttempt=null;go('results')}
function latestAttempt(){return db.attempts.filter(a=>a.userEmail===session.email).at(-1)}
function results(){const a=latestAttempt();layout(`${learnerNav('dashboard')}<div class="section-title"><div><div class="eyebrow">Assessment results</div><h2>${a.status==='passed'?'You passed the online assessment':'Keep practising and try again'}</h2></div><span class="pill">Submitted · answers locked</span></div><div class="grid two"><div class="card"><div class="eyebrow">Knowledge assessment</div><div class="score">${a.mcqScore}/5</div><p>${a.mcqScore>=db.settings.mcqPass?'Pass':'Not passed'} · threshold ${db.settings.mcqPass}/5</p></div><div class="card"><div class="eyebrow">Application assessment</div><div class="score">${a.writtenAverage.toFixed(1)}/5</div><p>${a.writtenAverage>=db.settings.writtenAverage?'Pass':'Not passed'} · average threshold ${db.settings.writtenAverage}/5</p></div></div>${MODULE.rubrics.map((r,i)=>{const g=a.written[r.id].grading;return `<div class="card report-block"><div class="section-title"><h3>Scenario ${i+1} · ${g.score}/5</h3><span class="pill">Rubric ${g.rubricVersion}</span></div><p><b>Your answer</b><br>${esc(a.written[r.id].answer)}</p><p><b>What you demonstrated</b><br>${esc(g.satisfied.join('; ')||'No criteria clearly demonstrated yet.')}</p><p><b>What was missing</b><br>${esc(g.missed.join('; ')||'No essential criteria were missed.')}</p><p>${esc(g.explanation)}</p><div class="notice"><b>Suggested improvement:</b> ${esc(g.improvement)}</div></div>`}).join('')}<div class="right" style="justify-content:flex-start"><button class="btn primary" onclick="go('report')">Open competency report →</button>${a.status!=='passed'?'<button class="btn secondary" onclick="startAssessment()">Retake with a fresh order</button>':''}</div>`)}
function report(){const a=latestAttempt();const rep=db.reports.find(r=>r.userEmail===session.email&&r.moduleId===1);layout(`${learnerNav('report')}<div class="section-title"><div><div class="eyebrow">Individual staff competency report</div><h2>${esc(session.name)}</h2><p class="muted">${esc(session.restaurant)} · Module 1 · ${MODULE.title}</p></div><span class="pill">Online ≠ workplace verification</span></div>${!a?`<div class="card"><h3>No assessment attempt yet</h3><p>Complete the lesson and assessment first.</p><button class="btn primary" onclick="go('lesson')">Open lesson</button></div>`:`<div class="grid two"><div class="card"><div class="eyebrow">Knowledge assessment</div><div class="score">${a.mcqScore}/5</div><span class="pill">${a.mcqScore>=db.settings.mcqPass?'Passed':'Not passed'}</span></div><div class="card"><div class="eyebrow">Application assessment</div><div class="score">${a.writtenAverage.toFixed(1)}/5</div><span class="pill">${a.writtenAverage>=db.settings.writtenAverage?'Passed':'Not passed'}</span></div></div><div class="card" style="margin-top:16px"><div class="section-title"><h2>Workplace competency verification</h2><span class="pill">${rep?esc(rep.outcome):'Outstanding'}</span></div><p class="muted">This section is completed by the restaurant manager. Karibu Academy does not personally observe workplace performance.</p>${rep?`<p><b>Observed by:</b> ${esc(rep.managerName)} · ${esc(rep.date)}<br><b>Manager report:</b> ${esc(rep.notes)}</p>`:'<p class="notice">Invite your manager to use the practical guide and record an observation.</p>'}</div>`}`)}
function manager(){const learners=allUsers().filter(u=>u.role==='learner');layout(`<div class="nav"><button class="btn active">Manager workspace</button><button class="btn" onclick="go('admin')">Admin view</button></div><div class="section-title"><div><div class="eyebrow">Manager-led verification</div><h2>Workplace observations</h2></div><span class="pill">${learners.length} test learner${learners.length===1?'':'s'}</span></div><div class="card"><h3>Practical guide · ${MODULE.title}</h3><p>Observe the waiter during normal service or role-play. Look for prompt acknowledgement, warm language, upright/open body language, gentle eye contact, mood-aware tone and pace, and acknowledgement of secondary arrivals. Record evidence, then coach any gaps.</p><p class="small muted"><b>Suggested role-plays:</b> guest arrives while carrying a tray; celebratory couple plus rushed guest; multiple parties entering together.</p></div><div class="card table-wrap"><table class="table"><thead><tr><th>Staff member</th><th>Online status</th><th>Restaurant</th><th>Action</th></tr></thead><tbody>${learners.map(u=>{const a=db.attempts.filter(x=>x.userEmail===u.email).at(-1),r=db.reports.find(x=>x.userEmail===u.email);return `<tr><td><b>${esc(u.name)}</b><br><span class="small muted">${esc(u.email)}</span></td><td>${a?`<span class="pill">${esc(a.status)}</span>`:'Not started'}</td><td>${esc(u.restaurant)}</td><td><button class="btn secondary" onclick="observe('${encodeURIComponent(u.email)}')">${r?'Revisit report':'Start observation'} →</button></td></tr>`}).join('')}</tbody></table></div>`)}
function observe(encoded){const email=decodeURIComponent(encoded),u=allUsers().find(x=>x.email===email),r=db.reports.find(x=>x.userEmail===email)||{checks:{},notes:'',outcome:'Pending'};const items=['Acknowledges each arriving guest promptly, within the 30-second standard','Uses a warm greeting with eye contact and open body language','Scans the entrance while completing another task','Adjusts tone and pace to the guest’s mood','Acknowledges secondary arrivals with a nod, smile or gesture','Follows up with a proper welcome when free'];layout(`<div class="nav"><button class="btn active" onclick="go('manager')">Manager dashboard</button><button class="btn" onclick="go('manager')">← Manager workspace</button></div><div class="section-title"><div><div class="eyebrow">Observation report</div><h2>${esc(u.name)}</h2><p class="muted">${esc(u.restaurant)} · ${MODULE.title}</p></div><span class="pill">Manager: ${esc(session.name)}</span></div><div class="card"><h3>Observation checklist</h3>${items.map((x,i)=>`<div class="check-row"><span>${esc(x)}</span><select id="c${i}"><option ${r.checks[i]==='Meets standard'?'selected':''}>Meets standard</option><option ${r.checks[i]==='Needs improvement'?'selected':''}>Needs improvement</option><option ${r.checks[i]==='Not observed'?'selected':''}>Not observed</option></select></div>`).join('')}<div class="field"><label>Observation date</label><input id="odate" type="date" value="${r.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Manager report</label><textarea id="notes" placeholder="What was observed? Strengths, examples, coaching provided and recommended follow-up actions.">${esc(r.notes)}</textarea></div><div class="field"><label>Verification outcome</label><select id="outcome"><option ${r.outcome==='Pending'?'selected':''}>Pending</option><option ${r.outcome==='Verified competent'?'selected':''}>Verified competent</option><option ${r.outcome==='Coaching required'?'selected':''}>Coaching required</option></select></div><button class="btn primary" onclick="saveReport('${encodeURIComponent(email)}')">Save observation report</button></div>`)}
function saveReport(encoded){const email=decodeURIComponent(encoded),checks={};for(let i=0;i<6;i++)checks[i]=document.getElementById('c'+i).value;const old=db.reports.findIndex(r=>r.userEmail===email);const r={userEmail:email,staffMember:allUsers().find(u=>u.email===email).name,restaurant:allUsers().find(u=>u.email===email).restaurant,moduleId:1,module:MODULE.title,managerName:session.name,date:document.getElementById('odate').value,checks,notes:document.getElementById('notes').value,outcome:document.getElementById('outcome').value};if(old>=0)db.reports[old]=r;else db.reports.push(r);save();go('manager')}
function admin(){const attempts=db.attempts;layout(`<div class="nav"><button class="btn active">Admin dashboard</button><button class="btn" onclick="go('manager')">Manager workspace</button></div><div class="section-title"><div><div class="eyebrow">Administrator and partner testing dashboard</div><h2>Inspect the whole process</h2></div><span class="pill">Module 1 only</span></div><div class="grid"><div class="card stat"><b>${allUsers().filter(u=>u.role==='learner').length}</b><span>test learners</span></div><div class="card stat"><b>${attempts.length}</b><span>assessment attempts</span></div><div class="card stat"><b>${db.reports.length}</b><span>manager reports</span></div></div><div class="card" style="margin-top:16px"><div class="section-title"><h2>Configurable thresholds</h2><span class="small muted">Stored in this test environment</span></div><div class="grid two"><div class="field"><label>Knowledge pass mark / 5</label><input id="mcqpass" type="number" min="0" max="5" value="${db.settings.mcqPass}"></div><div class="field"><label>Written average pass / 5</label><input id="writtenpass" type="number" min="0" max="5" step=".5" value="${db.settings.writtenAverage}"></div></div><button class="btn secondary" onclick="saveSettings()">Save thresholds</button></div><div class="card table-wrap" style="margin-top:16px"><h2>Assessment attempts</h2><table class="table"><thead><tr><th>Learner</th><th>MCQ</th><th>Written</th><th>Status</th><th>Submitted</th></tr></thead><tbody>${attempts.length?attempts.map(a=>`<tr><td><b>${esc(allUsers().find(u=>u.email===a.userEmail)?.name||a.userEmail)}</b><br><span class="small muted">${esc(a.userEmail)}</span></td><td>${a.mcqScore}/5</td><td>${a.writtenScores.join(' + ')} / 10<br>avg ${a.writtenAverage.toFixed(1)}</td><td><span class="pill">${a.status}</span></td><td>${new Date(a.submittedAt).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No attempts yet.</td></tr>'}</tbody></table></div><div class="card"><h2>Rubric register</h2>${MODULE.rubrics.map((r,i)=>`<div class="report-block"><b>Scenario ${i+1} · ${esc(r.id)} · version module-1-v1</b><p class="small">${esc(r.objective)}</p><p class="small muted">Essential criteria: ${esc(r.essential.join(' · '))}</p></div>`).join('')}</div>`)}
function adminWithReports(){const attempts=db.attempts;const reports=db.reports;layout(`<div class="nav"><button class="btn active">Admin dashboard</button><button class="btn" onclick="go('manager')">Manager workspace</button></div><div class="section-title"><div><div class="eyebrow">Administrator and partner testing dashboard</div><h2>Inspect the whole process</h2></div><span class="pill">Module 1 only</span></div><div class="grid"><div class="card stat"><b>${allUsers().filter(u=>u.role==='learner').length}</b><span>test learners</span></div><div class="card stat"><b>${attempts.length}</b><span>assessment attempts</span></div><div class="card stat"><b>${reports.length}</b><span>manager reports</span></div></div><div class="card" style="margin-top:16px"><div class="section-title"><h2>Saved manager reports</h2><span class="small muted">Read only · ${reports.length} saved</span></div>${reports.length?reports.map(r=>{const checks=Object.values(r.checks||{}).map(x=>esc(x)).join(' · ');return `<article class="report-block"><div class="section-title"><div><h3>${esc(r.staffMember||'Unknown staff member')}</h3><p class="muted">${esc(r.restaurant||'Unknown restaurant')} · ${esc(r.module||'Module 1')}</p></div><span class="pill">${esc(r.outcome||'Pending')}</span></div><p><b>Manager:</b> ${esc(r.managerName||'Unknown')} · <b>Date:</b> ${esc(r.date||'Not recorded')}</p><p><b>Checklist:</b> ${checks||'No checklist values recorded.'}</p><p><b>Manager report:</b><br>${esc(r.notes||'No notes recorded.')}</p></article>`}).join(''):'<p class="muted">No manager reports have been saved yet.</p>'}</div><div class="card table-wrap" style="margin-top:16px"><h2>Assessment attempts</h2><table class="table"><thead><tr><th>Learner</th><th>MCQ</th><th>Written</th><th>Status</th><th>Submitted</th></tr></thead><tbody>${attempts.length?attempts.map(a=>`<tr><td><b>${esc(allUsers().find(u=>u.email===a.userEmail)?.name||a.userEmail)}</b><br><span class="small muted">${esc(a.userEmail)}</span></td><td>${a.mcqScore}/5</td><td>${a.writtenScores.join(' + ')} / 10<br>avg ${a.writtenAverage.toFixed(1)}</td><td><span class="pill">${a.status}</span></td><td>${new Date(a.submittedAt).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="5" class="muted">No attempts yet.</td></tr>'}</tbody></table></div><div class="card" style="margin-top:16px"><div class="section-title"><h2>Configurable thresholds</h2><span class="small muted">Stored in this test environment</span></div><div class="grid two"><div class="field"><label>Knowledge pass mark / 5</label><input id="mcqpass" type="number" min="0" max="5" value="${db.settings.mcqPass}"></div><div class="field"><label>Written average pass / 5</label><input id="writtenpass" type="number" min="0" max="5" step=".5" value="${db.settings.writtenAverage}"></div></div><button class="btn secondary" onclick="saveSettings()">Save thresholds</button></div><div class="card" style="margin-top:16px"><h2>Rubric register</h2>${MODULE.rubrics.map((r,i)=>`<div class="report-block"><b>Scenario ${i+1} · ${esc(r.id)} · version module-1-v1</b><p class="small">${esc(r.objective)}</p><p class="small muted">Essential criteria: ${esc(r.essential.join(' · '))}</p></div>`).join('')}</div>`)}
function saveSettings(){db.settings.mcqPass=Number(document.getElementById('mcqpass').value);db.settings.writtenAverage=Number(document.getElementById('writtenpass').value);save();adminWithReports()}
function render(){if(!session)return view==='login'?login():view==='lesson'?lesson():home();if(view==='home')home();else if(view==='dashboard')dashboard();else if(view==='lesson')lesson();else if(view==='assessment')assessment();else if(view==='results')results();else if(view==='report')report();else if(view==='manager'&&session.role==='manager')manager();else if(view==='admin'&&session.role==='admin')adminWithReports();else if(session.role==='manager')manager();else if(session.role==='admin')adminWithReports();else dashboard()}
render();
</script></body></html>
