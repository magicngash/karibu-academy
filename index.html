 situation does not escalate because the employee remains calm and focused on resolving the problem. Emotional intelligence is particularly important when a customer's emotions are high. The employee cannot always control the customer's reaction, but can control their own response. Listening is a virtue and one should constantly be conscious of keen listening habits. Guests are also prone to bad moods and we cannot control that. Any slight provocation may trigger a negative reaction from a guest. Remaining patient while an upset guest vents is not optional.","why":"Emotional detachment prevents burnout."},{"icon":"check","title":"Building Trust Through Empathy","what":"The kitchen department may be overwhelmed by orders. Sometimes there may be an equipment breakdown. All these and other mishaps may occasion delay in output. Picture taking personal responsibility for fixing a delayed course, proving that customer satisfaction matters deeply. Demonstrating genuine care for the guest's comfort and experience.","how":["Explain to a guest that there is a delay in delivering their order even before they ask.","Validate feelings sincerely and take ownership."],"example":"A guest complains that a special meal they requested was not prepared according to their dietary requirement. Rather than immediately explaining why the mistake occurred, the server first acknowledges the customer's concern: “I understand why you're concerned, especially because you specifically mentioned your dietary requirement. I'm sorry this happened. Let me correct it immediately.” The server informs the kitchen, arranges the correct meal and returns later to confirm that everything is now satisfactory. The guest appreciates not only that the problem was corrected, but also that the server took the concern seriously and did not make excuses. Empathy does not mean agreeing with everything a customer says. It means showing that you understand the customer's experience and are genuinely committed to helping. A guest may see their order as simple e.g., a cup of coffee, but they may not realise that the source of all meals is the same busy kitchen hence occasioning delay of all orders across board. As a server, one should take personal responsibility for fixing a delayed course.","why":"Empathy drives lifelong loyalty.","scripts":[{"label":"Recognising an Upset Guest","text":"Create a simple protocol: Observe → Acknowledge → Listen → Adapt → Resolve → Follow up."},{"label":"Emotional Guest","text":"Recommended language: \"I can see this has been frustrating. Let me see how I can help.\" Avoid: \"Calm down.\" or \"It's not my fault.\""}]}],"takeaways":["Read the guest's emotional state: Pay attention to facial expressions, posture, hesitation and other behavioural signals so that you can respond appropriately.","Recognise signs of stress, impatience, confusion and disappointment: Early recognition allows you to intervene before a minor concern becomes a serious service problem.","Adapt to different personalities: Adjust your communication and service approach to what the individual guest appears to need while maintaining professionalism.","Manage difficult interactions calmly: Separate personal emotions from the operational problem and avoid responding defensively.","Use empathy to build trust: Validate genuine customer concerns and demonstrate that you care about the customer's experience. The manual specifically links empathy with validating feelings and taking ownership.","Use emotional intelligence proactively: Understanding customer emotions should help you prevent problems, not merely respond after something has gone wrong."],"caseStudy":{"title":"The Indecisive and Anxious Guest","scenario":"A guest shows clear signs of confusion and stress while reviewing the menu. A rigid server gives a long, uncustomised speech.","questions":[{"q":"How does recognizing confusion help you tailor your recommendations?","modelAnswer":"Spotting furrowed brows (frowning) or hesitation allows the employee to step in with simplified, direct recommendations, reducing cognitive overload and stress for the guest."},{"q":"Why is emotional intelligence vital for managing difficult interactions?","modelAnswer":"Emotional intelligence enables staff to detach personal feelings from operational problems, maintain calm professional behaviour, and build trust through empathy."}]},"quiz":[{"q":"Why is recognizing different customer personality types important?","options":[{"label":"It helps tailor your communication style so guests feel comfortable and understood","correct":true},{"label":"It allows you to label people","correct":false},{"label":"It has no effect","correct":false}],"feedback":"Adapting to personality styles ensures your service matches what the customer values."},{"q":"What does building trust through empathy involve?","options":[{"label":"Validating feelings sincerely and taking ownership of the experience","correct":true},{"label":"Dismissing complaints","correct":false},{"label":"Pretending problems don't exist","correct":false}],"feedback":"Sincere validation proves that customer satisfaction matters."},{"q":"How can you begin to understand a guest's emotional state upon arrival?","options":[{"label":"By asking them to fill out an emotion survey","correct":false},{"label":"By observing micro-expressions and posture changes immediately","correct":true},{"label":"By ignoring their body language","correct":false}],"feedback":"Observing micro-expressions and posture changes allows for early awareness and proactive approach adjustments."},{"q":"What should you do when you spot furrowed brows over a menu indicating confusion?","options":[{"label":"Walk away and let them struggle","correct":false},{"label":"Offer simplified recommendations to clear up the confusion","correct":true},{"label":"Tell them to order something else","correct":false}],"feedback":"Identifying specific emotional triggers like confusion helps you provide targeted support."},{"q":"How should you manage difficult interactions with challenging personalities?","options":[{"label":"Take the comments personally and argue back","correct":false},{"label":"Separate personal emotion from operational problems and remain patient","correct":true},{"label":"Refuse to serve them","correct":false}],"feedback":"Separating personal feelings from operational problems prevents burnout and keeps interactions professional."}],"badgeTitle":"Emotional Champion","curriculum":"Curriculum: Reading Emotions Quickly, Recognizing Stress, Impatience, Confusion, and Disappointment, Adapting to Different Personality Types, Managing Difficult Interactions Calmly, Building Trust Through Empathy."},"9":{"eyebrow":"CUSTOMER CARE · MODULE 9","topBarLabel":"MODULE 9 · Teamwork","title":"Teamwork, Accountability, and Shift Culture","description":"Improve internal service consistency through peer teamwork under pressure, thorough shift handovers, mutual support, personal ownership, and reporting lines.","objectives":["Collaborate effectively with colleagues during peak operating hours.","Conduct thorough shift handovers and support teammates.","Take ownership of mistakes and follow proper reporting lines."],"lessons":[{"icon":"users","title":"Working with Colleagues Under Pressure","what":"It’s Friday evening and the restaurant is awash with guests. Your colleague may be overwhelmed by the number of orders owing to the heavy traffic. Consider stepping in to clear tables for the struggling teammate during a heavy weekend rush to keep the floor moving. Supporting front and back-of-house peers seamlessly during hectic periods.","how":["Keep your eyes on all tables even if you are not the one serving on them.","Do not walk about with an attitude that there are jobs that you cannot do.","Put yourself in your colleague’s shoes, you may also experience a tough day and would wish someone was their to assist or support you. Step up and support when an opportunity shows up.","Communicate needs clearly and share workload burdens."],"example":"It is Friday evening and the restaurant is operating at full capacity. One server is dealing with several tables at once, while another section has temporarily become quiet. The second server notices that the colleague has several dirty tables waiting to be cleared and that clean utensils are running low. Instead of remaining in their own section because “those are not my tables,” the second server clears two tables, helps replenish the utensils and tells the colleague: “I'll take care of these tables while you finish with your orders.” The colleague is then able to concentrate on the customers waiting for their meals, and the entire floor continues moving efficiently. Teamwork during pressure is not about taking over another person's responsibilities. It is about recognising where support is needed and helping the operation continue smoothly. The rush period in a restaurant means that your work will also be under pressure for various reasons such as slow order delivery, scarcity of clean utensils among other challenges. Clearing tables for a struggling teammate during a rush ensures that your service is efficient.","why":"Great customer care relies on cohesive internal teamwork."},{"icon":"check","title":"Shift Handovers","what":"There is an international conference in town and a high demand for restaurants has arisen. You are one of the indirect beneficiaries as guests have flooded your premise. Imagine briefing incoming staff about a VIP anniversary party so nothing falls through the cracks. Passing critical information, table statuses, and requests between shifts.","how":["Conduct briefings covering VIP tables and pending notes.","Ensure that your colleagues are well aware of the high influx of guests","Work closely with each other in order to provide world class service to the VIPs who will be patronising your premise."],"example":"Briefing incoming staff about a VIP anniversary party. An international conference has brought an unusually large number of guests to the restaurant. During the outgoing shift, one table has a VIP anniversary celebration, another guest has requested a specific dietary adjustment, and two tables have outstanding requests. Before leaving, the outgoing server briefs the incoming colleague: “Table 12 is the anniversary party; they have requested the dessert at 8.30 p.m. Table 8 has a dairy-free request that has already been confirmed with the kitchen. Table 15 is waiting for the manager regarding the bill.” The incoming server records the information and takes responsibility for the pending matters. Later, when the anniversary dessert is delivered on time and the dietary request is correctly handled, the guests experience uninterrupted service despite the change of shift. A proper handover transfers responsibility and information—not merely the physical section—from one employee to another.","why":"Every activity should be well documented during busy moments. Servers should not assume that their colleagues will be in the stride with a previous shift. Handovers prevent service continuity gaps."},{"icon":"users","title":"Supporting Teammates","what":"Picture running food for a colleague when your own section is temporarily quiet. Actively looking out for peers and assisting before bottlenecks occur.","how":["Monitor bandwidth and offer help during lulls."],"example":"Running food for a colleague when your section is quiet. A server has just completed service in their section and notices that a colleague is struggling to deliver three meals to a large table. Rather than waiting for the colleague to ask for help, the available server approaches and says: “I have a moment. I'll run these two meals for you.” After delivering the food, the server returns to their own section before the next customer requires assistance. The colleague is able to serve the table while the food is still hot, and the guests do not experience the internal pressure that the team was facing. Good teamwork often means noticing what needs to be done before someone has to ask for help.","why":"Mutual support creates high-morale shift cultures."},{"icon":"check","title":"Taking Ownership of Mistakes","what":"Consider admitting a POS entry error directly to a supervisor rather than blaming the kitchen. Owning errors honestly without shifting blame.","how":["Acknowledge missteps immediately and fix them."],"example":"Admitting a POS entry error to a supervisor. A server accidentally enters three chicken meals instead of two into the POS system. The kitchen prepares the three meals before the error is noticed. The server could blame the kitchen for preparing the order exactly as it appeared on the ticket. Instead, the server immediately informs the supervisor: “I made an error when entering Table 8's order. I entered three chicken meals instead of two. I've informed the supervisor and I'll help correct the order.” The supervisor determines what action should be taken, and the server ensures that the customer receives the correct order. The mistake is then discussed privately so that the employee understands how to avoid repeating it. Taking ownership does not mean avoiding mistakes; it means acknowledging them, correcting them and learning from them without shifting blame.","why":"Accountability builds integrity and trust."},{"icon":"check","title":"Escalation and Reporting Lines","what":"Imagine notifying maintenance through standard channels immediately when a billing terminal malfunctions. Following organizational hierarchies when reporting faults or issues.","how":["Report problems to immediate supervisors through standard channels."],"example":"Notifying maintenance when billing terminals malfunction. During service, the restaurant's billing terminal suddenly stops processing card payments. Several guests are waiting to settle their bills. Instead of repeatedly restarting the machine or discussing the technical problem with customers, the server immediately informs the supervisor: “The billing terminal at Station 2 is not processing payments. I have stopped using it and need assistance.” The supervisor follows the established reporting procedure and contacts the appropriate technical/maintenance support. Meanwhile, the server informs affected guests politely that the restaurant is addressing the temporary payment issue and provides the available alternative where authorised. Effective escalation means reporting the problem through the correct channel quickly enough to minimise its effect on customers and operations.","why":"Structured reporting ensures efficient resolution.","scripts":[{"label":"Shift Handover Checklist","text":"Communicate by using a checklist"},{"label":"\"See It – Own It – Act\"","text":"SEE IT → OWN IT → ACT ON IT → INFORM IF NECESSARY For example: A dirty table is seen by a staff member. They don't say: \"That's not my section.\" They clear/reset it or alert the appropriate colleague."},{"label":": Escalation and Reporting","text":"What to report → Who to report to → When to report → What information to provide → What to document. This will turn \"follow proper reporting lines\" into an actionable procedure."}]}],"takeaways":["Customer service is a team responsibility: Support colleagues during busy periods rather than limiting yourself strictly to your own immediate tasks.","Maintain awareness beyond your own section: Observe the wider service environment and step in when another colleague or guest needs assistance.","Conduct effective shift handovers: Pass on VIP information, pending requests, table statuses and other critical information so that service continuity is maintained.","Support colleagues actively: Share workload and communicate clearly, particularly during peak operating periods.","Take ownership of mistakes: Accept responsibility, report problems appropriately and participate in correcting them rather than shifting blame.","Know the reporting and escalation lines: Serious or unresolved matters should reach the appropriate person promptly.","Build a culture of mutual accountability: A strong service team takes collective responsibility for the guest experience."],"caseStudy":{"title":"The Blame Game","scenario":"An order is entered incorrectly. The server blames the kitchen staff loudly in front of guests instead of taking ownership.","questions":[{"q":"Why is taking personal ownership of mistakes vital for team culture?","modelAnswer":"Owning missteps honestly without shifting blame builds workplace integrity, accountability, and a supportive team environment."},{"q":"How do thorough shift handovers prevent service failures?","modelAnswer":"Clear handovers pass on vital operational notes, VIP statuses, and pending tasks so that incoming staff experience zero service continuity gaps."}]},"quiz":[{"q":"Why are thorough shift handovers critical?","options":[{"label":"They pass on vital operational notes and pending requests to prevent service gaps","correct":true},{"label":"They let staff leave early","correct":false},{"label":"They replace training","correct":false}],"feedback":"Smooth handovers ensure incoming staff are fully briefed."},{"q":"What does taking ownership of a mistake involve?","options":[{"label":"Acknowledging the misstep honestly and taking immediate action to fix it","correct":true},{"label":"Blaming teammates","correct":false},{"label":"Hiding the error","correct":false}],"feedback":"Accountability fosters integrity and trust."},{"q":"What is required when working with colleagues under pressure during hectic periods?","options":[{"label":"Communicating needs clearly and sharing workload burdens","correct":true},{"label":"Working completely isolated from others","correct":false},{"label":"Complaining to the guests about your coworkers","correct":false}],"feedback":"Great customer care relies on cohesive internal teamwork and shared workloads."},{"q":"What does supporting teammates involve during a shift?","options":[{"label":"Waiting until they fail before offering help","correct":false},{"label":"Actively monitoring bandwidth and offering assistance during lulls","correct":true},{"label":"Ignoring their tasks completely","correct":false}],"feedback":"Mutual support and looking out for peers create high-morale shift cultures."},{"q":"How should you handle reporting faults or issues within the organization?","options":[{"label":"Report problems to immediate supervisors through standard reporting lines","correct":true},{"label":"Post them publicly on social media","correct":false},{"label":"Hide them from management","correct":false}],"feedback":"Following organizational hierarchies ensures efficient resolution of faults."}],"badgeTitle":"Teamwork Champion","curriculum":"Curriculum: Working with Colleagues Under Pressure, Shift Handovers, Supporting Teammates, Taking Ownership of Mistakes, Escalation and Reporting Lines."},"10":{"eyebrow":"CUSTOMER CARE · MODULE 10","topBarLabel":"MODULE 10 · Service Standards","title":"Service Standards, Professionalism, and Quality Control","description":"Make service measurable and consistent by establishing appearance standards, cleanliness benchmarks, timing targets, quality checks, and self-auditing habits.","objectives":["Maintain professional appearance, grooming, and station cleanliness.","Meet service timing benchmarks and execute quality checks.","Utilize self-auditing and supervisor feedback to maintain standards."],"lessons":[{"icon":"target","title":"Appearance and Grooming Standards","what":"Picture inspecting your uniform, nametag, and hygiene in the mirror before stepping onto the floor to build instant credibility. Presenting a clean, professional personal appearance.","how":["Wear clean uniforms, neat hair, and impeccable hygiene."],"example":"Inspecting uniform and nametag before floor entry. Before starting the morning shift, a server stands in front of the staff-room mirror and notices that their uniform has a visible stain and their name tag is missing. Rather than entering the restaurant and hoping customers will not notice, the server changes into a clean uniform and replaces the name tag. Before leaving the staff area, the server checks their hair, shoes and general hygiene and confirms that everything meets the establishment's standard. When the server enters the floor, they are ready to represent the restaurant professionally from the first customer interaction. Professional appearance is not something to correct after a customer notices it. It is a pre-shift responsibility.","why":"Professional grooming builds immediate visual credibility."},{"icon":"check","title":"Cleanliness and Readiness","what":"Consider wiping down and resetting a table immediately after guest departure to maintain pristine readiness. Keeping service stations and tables immaculately clean.","how":["Reset tables promptly and ensure menus are spotless."],"example":"Wiping down a table immediately after departure. A table becomes vacant after a family finishes its meal. The server notices that used plates and glasses remain on the table and that the menus are slightly soiled. Rather than leaving the table until the next guests arrive, the server clears the used items, wipes and sanitises the table, checks the chairs, replaces the menus and resets the table with the required cutlery. A few minutes later, new guests are seated at the clean, prepared table without having to wait for the previous table to be reset. Readiness means preparing the service environment continuously, not waiting until the restaurant becomes visibly untidy.","why":"Cleanliness is a fundamental baseline for hospitality."},{"icon":"check","title":"Service Timing Benchmarks","what":"Imagine tracking drink delivery to ensure it hits the table within the five-minute benchmark. Adhering to standard time targets for greetings, drinks, and food delivery.","how":["Monitor pacing against established benchmarks like the 30-second rule."],"example":"Ensuring drinks arrive within five minutes. A guest is welcomed promptly after arriving and places an order that includes two soft drinks. The server sends the order through immediately and monitors the drinks rather than assuming someone else is handling them. After a few minutes, the server notices that the drinks have not yet arrived. Instead of waiting until the guest complains, the server checks with the bar and discovers that the order has been delayed. The drinks are delivered within the established five-minute service target, and the server continues monitoring the table to ensure that the delay does not affect the rest of the meal. A timing benchmark is not simply a number to memorise. It is a standard that requires employees to monitor service and intervene before delays become customer complaints.","why":"Timing benchmarks ensure operational efficiency."},{"icon":"check","title":"Quality Checks","what":"Picture catching a missing side dish visually against the ticket right at the kitchen counter before walking out. Inspecting items and setups for perfection before serving.","how":["Check order accuracy against tickets visually."],"example":"Catching a missing side dish at the kitchen counter. A server collects an order for Table 6 from the kitchen. Before leaving the pass, the server compares the food with the ticket and notices that the guest requested a side salad, but the salad is missing. Instead of taking the incomplete order to the table and explaining the mistake later, the server alerts the kitchen and waits for the missing side to be added. The complete order is then taken to the table, allowing the guest to receive exactly what was ordered. Lesson: The best time to discover a service error is before it reaches the customer.","why":"Quality checks stop errors at the source."},{"icon":"check","title":"Self-Auditing and Supervisor Feedback","what":"Consider discussing constructive supervisor notes during post-shift debriefs to turn training into permanent excellence. Evaluating your performance and welcoming management feedback.","how":["Review shift performance objectively and apply coaching."],"example":"Discussing supervisor notes during post-shift debriefs. At the end of a busy shift, a supervisor tells a server: “You handled the complaints professionally today, but I noticed that two tables waited longer than necessary before receiving their drinks.” Instead of becoming defensive, the server reviews what happened. They realise that during the busiest period they concentrated on taking new orders and failed to monitor the drinks already ordered. The server discusses the issue with the supervisor and decides to use a simple mental check during future busy periods: new orders, pending drinks, pending food, customer follow-up. During the following shifts, the server consciously monitors these areas and receives improved feedback. Self-auditing turns feedback into action. The objective is not simply to identify what went wrong, but to change behaviour and improve the next shift.","why":"Self-auditing turns training into permanent standards.","scripts":[{"label":": Pre-Shift Readiness Checklist","text":"Use a practical checklist"},{"label":"Table Reset Standard","text":"Guest leaves → Clear → Clean → Reset → Inspect → Mark ready."},{"label":"Quality Control Before Leaving the Kitchen","text":"The \"STOP\" Quality Check S – Special requests checked T – Ticket/order checked O – Order complete P – Presentation checked"}]}],"takeaways":["Professional appearance creates credibility: Personal grooming, a clean uniform and appropriate presentation establish the professional standard before the first conversation begins.","Cleanliness and readiness are fundamental: Keep service stations, tables, menus and other guest-facing areas clean, organised and ready for service.","Respect service timing standards: Monitor service pacing and work within established benchmarks to maintain smooth and efficient operations.","Check quality before service reaches the guest: Verify that orders are accurate, complete and presented according to the required standard.","Maintain consistency throughout the shift: Service standards should not decline because the restaurant becomes busy or the employee becomes tired.","Self-audit your performance: Regular reflection helps identify gaps between expected and actual performance.","Use supervisor feedback constructively: Feedback should be used to turn training into consistent, repeatable standards of excellence."],"caseStudy":{"title":"The Untidy Station","scenario":"A server with a messy uniform and cluttered station attempts to deliver fine service. Guests notice the lack of cleanliness immediately.","questions":[{"q":"Why does personal grooming and station cleanliness affect guest trust?","modelAnswer":"Impeccable appearance and clean stations provide immediate visual credibility, serving as the baseline standard for overall quality and hygiene."},{"q":"How do self-auditing and supervisor feedback drive continuous improvement?","modelAnswer":"Objective self-reflection and openness to coaching turn isolated training points into repeatable, long-term standards of excellence."}]},"quiz":[{"q":"Why are professional appearance and grooming standards essential?","options":[{"label":"They build immediate visual credibility and trust with guests","correct":true},{"label":"They have no impact","correct":false},{"label":"They are optional","correct":false}],"feedback":"Impeccable grooming sets a professional tone before conversation begins."},{"q":"What is the purpose of self-auditing and supervisor feedback?","options":[{"label":"To turn training into a repeatable, continuously improving standard of excellence","correct":true},{"label":"To penalize staff","correct":false},{"label":"To slow operations","correct":false}],"feedback":"Continuous reflection ensures service standards remain high."},{"q":"Why is inspecting your uniform and nametag before floor entry important?","options":[{"label":"It builds immediate visual credibility and professional presence","correct":true},{"label":"It is just a formality with no real impact","correct":false},{"label":"It slows down shift preparation","correct":false}],"feedback":"Impeccable grooming sets a professional standard before any interaction begins."},{"q":"What does maintaining cleanliness and readiness involve on the floor?","options":[{"label":"Keeping service stations clean, resetting tables promptly, and ensuring spotless menus","correct":true},{"label":"Cleaning up only at the end of the week","correct":false},{"label":"Leaving used plates on tables for decoration","correct":false}],"feedback":"Cleanliness is a fundamental baseline for hospitality and guest readiness."},{"q":"What is the main purpose of monitoring service pacing against benchmarks?","options":[{"label":"To ensure operational efficiency and smooth service delivery","correct":true},{"label":"To pressure staff unnecessarily","correct":false},{"label":"To replace customer feedback entirely","correct":false}],"feedback":"Adhering to timing targets keeps the entire operation flowing smoothly."}],"badgeTitle":"Service Champion","curriculum":"Curriculum: Appearance and Grooming Standards, Cleanliness and Readiness, Service Timing Benchmarks, Quality Checks, Self-Auditing and Supervisor Feedback."}};
</script>

// Plain fetch-based RPC helper — no external SDK/script tag required,
// so this works both in a live artifact preview and as standalone HTML.
async function callRpc(name, params) {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`
      },
      body: JSON.stringify(params)
    });
    const body = await res.json().catch(() => null);
    if (!res.ok) return {
      data: null,
      error: body || {
        message: res.statusText
      }
    };
    return {
      data: body,
      error: null
    };
  } catch (err) {
    return {
      data: null,
      error: {
        message: err.message
      }
    };
  }
}
